<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン画面</title>
	<link rel="stylesheet" href="/css/login.css">
</head>

<body>
	<header>
		<p>食事管理</p>
	</header>
	<h1>ログイン画面 </h1>
	<main>
		<span th:text="${message}" style="color:red"></span><br>
		<span th:text="${message1}" style="color:red"></span><br>
		<form action="/login" method="post">
			<input type="text" name="email" placeholder="メールアドレス" th:value="${email}">
			<br><input type="text" name="password" placeholder="パスワード" th:value="${password}">
			<br><button>ログイン</button>
		</form>
		<form action="/users/add"><button>新規登録</button></form>

	</main>


</body>

</html>
