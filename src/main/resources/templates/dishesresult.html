<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>登録内容一覧画面</title>
	<link rel="stylesheet" href="/css/result.css">
</head>

<body>
	<header>
		<h1>登録内容一覧</h1>
	</header>
	
	<main>
		<div class="andcenter">
		<form th:action="@{/dishes/result}" method="get">
			<input type="date" name="recordDate">
			<button class="search-button">検索</button>
		</form>
		<a href="/dishes/sort">最新順</a>
		</div>
		<table border="1">

			<tr>
				<th>日付</th>

				<th>主食</th>
				<th>副菜</th>
				<th>主菜</th>
				<th>乳製品</th>
				<th>果物</th>
				<th>メモ</th>
				<th>点数</th>
				<th>更新</th>
				<th>削除</th>
			</tr>

			<tr th:each="record:${resultList}">
				<td th:text="${record.recordDate}"></td>

				<td><span th:text="${record.stapleFood}"></span><br>
					<span th:text="${record.stapleFood >= 5 && record.stapleFood <= 7 ? '〇' : '✕'} "></span>
				</td>

				<td><span th:text="${record.sideDish}"></span><br>
					<span th:text="${record.sideDish >= 5 && record.sideDish <= 6 ? '〇' : '✕'} "></span>
				</td>

				<td><span th:text="${record.mainDish}"></span><br>
					<span th:text="${record.mainDish >= 3 && record.mainDish <= 5 ? '〇' : '✕'} "></span>
				</td>
				<td><span th:text="${record.milkDish}"></span><br>
					<span th:text="${record.milkDish == 2 ? '〇' : '✕'} "></span>
				</td>
				<td><span th:text="${record.fruitCount}"></span><br>
					<span th:text="${record.fruitCount == 2 ? '〇' : '✕'} "></span>
				</td>



				<td class="memo" th:text="${record.detailMemo}"></td>
				<td th:text="${record.achievement}"></td>
				<td>
					<form th:action="@{/dishes/{id}/edit(id=${record.id})}" method="get">
						<button class="edit-button">更新</button>
					</form>
				</td>
				<td>
					<form th:action="@{/dishes/{id}/delete(id=${record.id})}" method="post">
						<button class="delete-button">削除</button>
					</form>
				</td>
			</tr>


		</table>
		<p>88点満点</p>

		<div class="andright">
			<form action="/dishes/add" method="get">
				<button class="add-button">登録画面へ</button>
			</form>

			<a href="/logout" class="link">ログアウト</a>
		</div>
	</main>
</body>
<footer>
	<a href="https://www.maff.go.jp/j/balance_guide/">「食事バランスガイドについて」https://www.maff.go.jp/j/balance_guide/</a>
	<br><a href="https://www.shokuiku.net/score/hyouka.html">食事バランススコア評価方法https://www.shokuiku.net/score/hyouka.html</a>
</footer>

</html>
